<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>iLoveTransfer</title>

  <style>
    /* --- DESIGN SYSTEM: KRACKED DEVS INSPIRED --- */
    
    * {
      box-sizing: border-box;
      /* Monospace Foundation for a tech look */
      font-family: 'ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', monospace;
      /* Sharp Geometry: No rounded corners */
      border-radius: 0 !important;
    }

    body {
      margin: 0;
      min-height: 100vh;
      /* Deep Black Background with a subtle grid pattern */
      background-color: #000000;
      background-image: 
        linear-gradient(rgba(34, 197, 94, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(34, 197, 94, 0.03) 1px, transparent 1px);
      background-size: 20px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #FFFFFF; /* High contrast white text */
    }

    header {
      margin-bottom: 24px;
      text-align: center;
    }

    .logo {
      height: 50px;
      /* Subtle green glow to match the theme */
      filter: drop-shadow(0 0 8px rgba(34, 197, 94, 0.6));
    }

    /* Main Container Card */
    .card {
      background: rgba(27, 34, 27, 0.8); /* Semi-transparent dark surface */
      width: 100%;
      max-width: 420px;
      padding: 24px;
      border: 1px solid #22C55E; /* Neon Green Border */
      box-shadow: rgba(34, 197, 94, 0.1) 0px 0px 15px 0px;
      text-align: center;
      backdrop-filter: blur(4px);
    }

    .subtitle {
      color: #A3FFC6; /* Soft Mint accent */
      font-size: 14px;
      margin-bottom: 24px;
    }

    /* Input Styling */
    input {
      width: 100%;
      height: 40px;
      padding: 0 18px;
      margin-top: 10px;
      background: transparent;
      border: 1px solid rgba(34, 197, 94, 0.5);
      color: #FFFFFF;
      font-size: 14px;
      outline: none;
    }

    input:focus {
      border-color: #00FF5E; /* Bright green on focus */
      box-shadow: rgba(34, 197, 94, 0.2) 0px 0px 8px 0px;
    }

    /* Button Styling */
    button {
      width: 100%;
      height: 40px;
      margin-top: 16px;
      background: #22C55E; /* Solid Neon Green Primary */
      color: #000000; /* Black text on green background for high contrast */
      border: none;
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
      text-transform: uppercase;
      transition: 0.2s;
    }

    button:hover {
      background: #00FF5E; /* Brighter green on hover */
    }

    .status {
      margin-top: 16px;
      font-size: 13px;
      color: #22C55E;
      display: none;
    }

    /* File Selection Box */
    .file-box {
      margin-top: 24px;
      border: 1px dashed #22C55E;
      padding: 20px;
      cursor: pointer;
    }

    .file-box label {
      cursor: pointer;
      color: #A3FFC6;
      font-weight: 700;
    }

    .file-box input {
      display: none;
    }

    /* Progress Bars */
    .progress-group {
      margin-top: 20px;
      text-align: left;
      font-size: 12px;
      color: #737373;
    }

    progress {
      width: 100%;
      height: 10px;
      appearance: none;
      margin-top: 5px;
    }

    progress::-webkit-progress-bar {
      background: #171917;
    }

    progress::-webkit-progress-value {
      background: #22C55E;
    }

    footer {
      margin-top: 24px;
      font-size: 11px;
      color: #404040;
    }
  </style>
</head>

<body>

  <header>
    <img src="assets/ilt.png" alt="iLoveTransfer" class="logo">
  </header>

  <div class="card">
    <div class="subtitle">Quick file sharing between devices</div>

    <input id="room" placeholder="Enter a room name (e.g. office123)" required/>
    <button onclick="joinRoom()">Join Room</button>

    <div class="status" id="status">Connected</div>

    <div class="file-box">
      <label for="fileInput">Click to select files</label>
      <input type="file" id="fileInput" multiple />
    </div>

    <div class="progress-group">
      Uploading
      <progress id="upload" value="0" max="100"></progress>
    </div>

    <div class="progress-group">
      Downloading
      <progress id="download" value="0" max="100"></progress>
    </div>

    <footer>
      Simple • Fast • No login
    </footer>
  </div>

<script>
/* Functionality remains the same */
let ws;
let room = "default";

const uploadBar = document.getElementById("upload");
const downloadBar = document.getElementById("download");
const statusText = document.getElementById("status");

function connectWS() {
  ws = new WebSocket(
    location.protocol === "https:"
      ? "wss://" + location.host
      : "ws://" + location.host
  );

  ws.onopen = () => {
    statusText.style.display = "block";
    statusText.textContent = "Connected to server";
  };

  ws.onmessage = handleMessage;
}

connectWS();

function joinRoom() {
  if (ws.readyState !== WebSocket.OPEN) {
    alert("Still connecting... please wait.");
    return;
  }
  room = document.getElementById("room").value || "default";
  ws.send(JSON.stringify({ type: "join", room }));
  statusText.textContent = "In Room: " + room;
}

document.getElementById("fileInput").onchange = async (e) => {
  const files = e.target.files;
  if (!files.length) return;
  const chunkSize = 64 * 1024;
  
  for (let i = 0; i < files.length; i++) {
    const file = files[i];
    let offset = 0;
    uploadBar.value = 0;

    ws.send(JSON.stringify({ type: "file-start", name: file.name, size: file.size }));

    while (offset < file.size) {
      const slice = file.slice(offset, offset + chunkSize);
      const buffer = await slice.arrayBuffer();
      ws.send(buffer);
      offset += chunkSize;
      uploadBar.value = (offset / file.size) * 100;
    }
    ws.send(JSON.stringify({ type: "file-end" }));
  }
  
  // Clear the input so the same files can be selected again if needed
  e.target.value = "";
};

let chunks = [];
let fileName = "";
let received = 0;
let total = 0;

function handleMessage(msg) {
  if (typeof msg.data === "string") {
    const data = JSON.parse(msg.data);
    if (data.type === "file-start") {
      chunks = [];
      fileName = data.name;
      total = data.size;
      received = 0;
      downloadBar.value = 0;
    }
    if (data.type === "file-end") {
      const blob = new Blob(chunks);
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = fileName;
      a.click();
      downloadBar.value = 100;
    }
  } else {
    chunks.push(msg.data);
    received += msg.data.size;
    downloadBar.value = (received / total) * 100;
  }
}
</script>

</body>
</html>
